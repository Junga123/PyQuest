name: Build Android APK

# Облачная сборка release-APK PyQuest (Android Studio локально не нужен).
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PyQuestMobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # ВНИМАНИЕ: НЕ включаем cache: 'npm' — без package-lock.json это ломает сборку.

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK (assembleRelease)
        working-directory: PyQuestMobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "Found APK: $APK"
          echo "path=PyQuestMobile/android/$APK" >> "$GITHUB_OUTPUT"
        working-directory: PyQuestMobile/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyQuest-release-apk
          path: PyQuestMobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
